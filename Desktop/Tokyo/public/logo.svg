<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGradText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="30%" stop-color="#F1C40F"/>
      <stop offset="65%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#F3E5AB"/>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="glowLogo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="iconBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1B4E"/>
      <stop offset="80%" stop-color="#110822"/>
    </radialGradient>
  </defs>

  <!-- Logo Mark Icon Container (Left side) -->
  <g transform="translate(10, 10)">
    <circle cx="70" cy="70" r="66" fill="url(#iconBg)" stroke="url(#goldGradText)" stroke-width="3" />
    <circle cx="70" cy="70" r="60" fill="none" stroke="url(#goldGradText)" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" />

    <!-- Moon -->
    <path d="M 76 30 C 48 30, 26 52, 26 80 C 26 102, 42 120, 64 122 C 45 114, 37 94, 42 72 C 46 54, 61 38, 81 34 C 79 32, 78 31, 76 30 Z" fill="url(#goldGradText)" />

    <!-- North Star -->
    <g transform="translate(84, 56) scale(0.65)" filter="url(#glowLogo)">
      <path d="M 0 -45 Q 0 0 -45 0 Q 0 0 0 45 Q 0 0 45 0 Q 0 0 0 -45 Z" fill="url(#goldGradText)" />
      <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    </g>

    <!-- Little Heart -->
    <path d="M 70 98 C 70 98, 64 92, 61 88 C 58 84, 59 79, 63 77 C 66 75, 70 77, 70 80 C 70 77, 74 75, 77 77 C 81 79, 82 84, 79 88 C 76 92, 70 98, 70 98 Z" fill="url(#goldGradText)" opacity="0.95" />
  </g>

  <!-- Typography Brand Mark (Right side) -->
  <g transform="translate(170, 45)">
    <!-- Main Title: TOKYO -->
    <text x="0" y="48" 
          font-family="'Cinzel', 'Playfair Display', 'Georgia', 'Times New Roman', serif" 
          font-size="46" 
          font-weight="700" 
          letter-spacing="12" 
          fill="url(#goldGradText)">
      TOKYO
    </text>

    <!-- Divider Line -->
    <line x1="2" y1="64" x2="350" y2="64" stroke="url(#goldGradText)" stroke-width="1.5" opacity="0.4" />
    <circle cx="176" cy="64" r="3" fill="url(#goldGradText)" />

    <!-- Subtitle: OUR MEMORY UNIVERSE -->
    <text x="4" y="86" 
          font-family="'Inter', 'Montserrat', 'Helvetica', sans-serif" 
          font-size="13" 
          font-weight="500" 
          letter-spacing="7" 
          fill="#E2D4F0" 
          opacity="0.85">
      OUR MEMORY UNIVERSE
    </text>
  </g>
</svg>
