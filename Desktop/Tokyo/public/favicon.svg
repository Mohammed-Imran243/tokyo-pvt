<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#2D1B4E"/>
      <stop offset="60%" stop-color="#130B24"/>
      <stop offset="100%" stop-color="#080411"/>
    </radialGradient>
    
    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF099"/>
      <stop offset="25%" stop-color="#F1C40F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#FFE57F"/>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Badge Outer Ring -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="6" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.4" />

  <!-- Constellation Ambient Stars -->
  <g opacity="0.6" fill="#FFF099">
    <circle cx="120" cy="140" r="3" />
    <circle cx="390" cy="120" r="2.5" />
    <circle cx="100" cy="350" r="2" />
    <circle cx="380" cy="370" r="3" />
    <circle cx="256" cy="90" r="2" />
  </g>

  <!-- Constellation Connecting Lines -->
  <path d="M 120 140 L 170 200 L 256 90 L 340 180 L 390 120" stroke="url(#goldGrad)" stroke-width="1" opacity="0.25" fill="none" />
  <path d="M 100 350 L 180 320 L 256 420 L 330 310 L 380 370" stroke="url(#goldGrad)" stroke-width="1" opacity="0.25" fill="none" />

  <!-- Elegant Crescent Moon -->
  <path d="M 276 116 
           C 176 116, 96 196, 96 296 
           C 96 376, 156 440, 236 448 
           C 166 420, 136 346, 156 266 
           C 172 202, 226 142, 296 128 
           C 289 120, 283 117, 276 116 Z" 
        fill="url(#goldGrad)" 
        filter="url(#shadow)" />

  <!-- Central Sparkling North Star -->
  <g transform="translate(310, 210) scale(1.2)" filter="url(#glow)">
    <!-- 4-point Main Star -->
    <path d="M 0 -70 Q 0 0 -70 0 Q 0 0 0 70 Q 0 0 70 0 Q 0 0 0 -70 Z" fill="url(#goldGrad)" />
    <!-- 4-point Inner Star (Diagonal) -->
    <path d="M 0 -40 Q 0 0 -40 0 Q 0 0 0 40 Q 0 0 40 0 Q 0 0 0 -40 Z" fill="#FFFFFF" transform="rotate(45)" opacity="0.9" />
    <!-- Center Core Sparkle -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" />
  </g>

  <!-- Floating Mini Sparkle Star -->
  <g transform="translate(180, 170) scale(0.45)">
    <path d="M 0 -50 Q 0 0 -50 0 Q 0 0 0 50 Q 0 0 50 0 Q 0 0 0 -50 Z" fill="url(#goldGrad)" opacity="0.95" />
  </g>
  
  <g transform="translate(340, 340) scale(0.35)">
    <path d="M 0 -50 Q 0 0 -50 0 Q 0 0 0 50 Q 0 0 50 0 Q 0 0 0 -50 Z" fill="url(#goldGrad)" opacity="0.8" />
  </g>

  <!-- Delicate Romantic Heart Element at Base -->
  <path d="M 256 360 
           C 256 360, 235 340, 225 328 
           C 215 316, 218 300, 230 294 
           C 240 288, 251 294, 256 302 
           C 261 294, 272 288, 282 294 
           C 294 300, 297 316, 287 328 
           C 277 340, 256 360, 256 360 Z" 
        fill="url(#goldGrad)" opacity="0.9" filter="url(#shadow)" />
</svg>